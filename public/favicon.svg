<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a1f4a"/>
      <stop offset="60%" stop-color="#120c24"/>
      <stop offset="100%" stop-color="#080512"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8f1" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffd88a" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#ffb3ba" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2a1f4a" stop-opacity="0"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Midnight Rounded Badge with Gold Rim -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#skyGrad)" stroke="#ffd88a" stroke-width="2.5"/>

  <!-- Tiny Constellation Dots -->
  <circle cx="14" cy="16" r="1.2" fill="#ffd88a" opacity="0.75"/>
  <circle cx="48" cy="14" r="1.4" fill="#ffffff" opacity="0.9"/>
  <circle cx="52" cy="46" r="1" fill="#c4b5fd" opacity="0.7"/>
  <circle cx="12" cy="48" r="1.2" fill="#ffd88a" opacity="0.6"/>

  <!-- Warm Starlight Lantern Glow -->
  <circle cx="32" cy="33" r="19" fill="url(#glowGrad)"/>

  <!-- Stylized Midnight Lantern Housing -->
  <!-- Top handle & chimney ring -->
  <path d="M26 15 C26 11, 38 11, 38 15" fill="none" stroke="#ffd88a" stroke-width="2" stroke-linecap="round"/>
  <path d="M24 18 L40 18 L38 22 L26 22 Z" fill="#ffd88a" stroke="#26160f" stroke-width="0.8"/>

  <!-- Glass chamber -->
  <path d="M25 22 L39 22 L37 42 L27 42 Z" fill="rgba(255, 248, 241, 0.25)" stroke="#ffd88a" stroke-width="1.8"/>

  <!-- Golden Starlight Core (4-pointed star) -->
  <path d="M32 26 Q32 32 36 32 Q32 32 32 38 Q32 32 28 32 Q32 32 32 26 Z" fill="#fffdfa" filter="url(#goldGlow)"/>
  <circle cx="32" cy="32" r="2.2" fill="#ffd88a"/>

  <!-- Lantern base -->
  <path d="M23 42 L41 42 L39 46 L25 46 Z" fill="#ffd88a" stroke="#26160f" stroke-width="0.8"/>

  <!-- Pip's Signature Velvet Pink Bow -->
  <circle cx="32" cy="49" r="2" fill="#ffb3ba"/>
  <path d="M32 49 C28 46, 26 53, 30 54 Z" fill="#ffb3ba" stroke="#26160f" stroke-width="0.7"/>
  <path d="M32 49 C36 46, 38 53, 34 54 Z" fill="#ffb3ba" stroke="#26160f" stroke-width="0.7"/>

  <!-- Sparkle Accent -->
  <path d="M46 22 L47.5 25 L50.5 26.5 L47.5 28 L46 31 L44.5 28 L41.5 26.5 L44.5 25 Z" fill="#ffd88a" opacity="0.95"/>
</svg>